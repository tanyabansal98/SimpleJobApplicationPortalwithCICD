version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=jobportal
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=PostgresPassword123
    mem_limit: 200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/jobportal
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=PostgresPassword123
    depends_on:
      postgres-db:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-portal-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/jobportal
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=PostgresPassword123
      - SPRING_DATA_REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth-service:9090
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started