# ===============================
# POSTGRESQL DB
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/jobportal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PostgresPassword123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# SQL INIT (SEED DATA)
# ===============================
# Enabled: Azure's managed Postgres has no docker-entrypoint-initdb.d equivalent,
# so Spring must run schema.sql/data.sql/seed_jobs_data.sql itself via JDBC on
# every startup. All three files are written to be idempotent (IF NOT EXISTS,
# ON CONFLICT DO NOTHING, GREATEST-based sequence bumps) so this is safe to
# run repeatedly, not just once.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql,classpath:data.sql,classpath:seed_jobs_data.sql

# ===============================
# HIBERNATE
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ===============================
# REDIS / SESSION
# ===============================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis

# ===============================
# CLOUD NETWORKING
# ===============================
server.forward-headers-strategy=native

# ===============================
# AUTH MICROSERVICE
# ===============================
app.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:9090}

# ===============================
# QDRANT INIT
# ===============================
qdrant.url=https://dda01de9-cc4b-44c3-b9cf-9218673f4db2.us-east-1-1.aws.cloud.qdrant.io:6333
qdrant.api.key=${QDRANT_API_KEY:}

# ===============================
# EMBEDDING SERVICE SWITCH
# ===============================
embedding.mock.enabled=false

# ===============================
# OPENAI API KEY
# ===============================
openai.api.key=${OPENAI_API_KEY:sk-dummy-placeholder-key}