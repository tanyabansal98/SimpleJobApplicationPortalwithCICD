# ===============================
# POSTGRESQL DB
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/jobportal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PostgresPassword123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# SQL INIT (SEED DATA)
# ===============================
# Disabled: schema and data are initialised by the postgres initdb volume mount
# defined in docker-compose.yml (01-schema.sql, 02-data.sql).
# Spring Boot must NOT re-run them — it cannot handle OVERRIDING SYSTEM VALUE.
spring.sql.init.mode=never

# ===============================
# HIBERNATE
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ===============================
# REDIS / SESSION
# ===============================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis

# ===============================
# CLOUD NETWORKING
# ===============================
server.forward-headers-strategy=native

# ===============================
# AUTH MICROSERVICE
# ===============================
app.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:9090}

# ===============================
# QDRANT INIT
# ===============================
qdrant.url=http://qdrant:6333

# ===============================
# EMBEDDING SERVICE SWITCH
# ===============================
embedding.mock.enabled=true