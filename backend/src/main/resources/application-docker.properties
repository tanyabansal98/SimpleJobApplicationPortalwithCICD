# ===============================
# POSTGRESQL DB
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/jobportal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PostgresPassword123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# SQL INIT (SEED DATA)
# ===============================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ===============================
# HIBERNATE
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# REDIS / SESSION
# ===============================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis

# ===============================
# CLOUD NETWORKING
# ===============================
# Fixes the "Too Many Redirects" loop by trusting the Azure Load Balancer's HTTPS header
server.forward-headers-strategy=native

# ===============================
# AUTH MICROSERVICE
# ===============================
app.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:9090}

