spring.application.name=job-application-portal

# ===============================
# PROFILES
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:docker}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# JSP VIEW RESOLVER
# ===============================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===============================
# JACKSON
# ===============================
spring.jackson.default-property-inclusion=non_null

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# LOGGING
# ===============================
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n
#logging.level.root=OFF
#logging.level.com.job.portal=DEBUG