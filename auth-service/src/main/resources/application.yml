server:
  # The port this microservice will listen on
  port: 9090

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/jobportal}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:PostgresPassword123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    properties:
      hibernate:
        # Specifies PostgreSQL dialect so Hibernate generates proper PostgreSQL-compatible SQL queries
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # DDL Auto: MUST be set to "none" because we do NOT modify or drop the existing USERS schema.
      ddl-auto: none
    # Set to true to print SQL statements in our console logs for easier debugging
    show-sql: true

jwt:
  # Secret passphrase for token signature (must be at least 256 bits / 32 characters)
  secret: "mySuperSecretKeyThatIsAtLeast32BytesLongForSecurity"
  # Token lifetime (1 hour = 3,600,000 milliseconds)
  expiration-ms: 3600000
