server:
  # The port this microservice will listen on
  port: 9090

spring:
  datasource:
    # URL to connect to the database. 
    # When running on host, connects to localhost:1521. When inside Docker, we override via env variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    # Database login username
    username: ${SPRING_DATASOURCE_USERNAME:SYSTEM}
    # Database login password
    password: ${SPRING_DATASOURCE_PASSWORD:OraclePassword123}
    # The Oracle JDBC driver class
    driver-class-name: oracle.jdbc.OracleDriver
  
  jpa:
    properties:
      hibernate:
        # Specifies Oracle SQL dialect so Hibernate generates proper Oracle-compatible SQL queries
        dialect: org.hibernate.dialect.OracleDialect
    hibernate:
      # DDL Auto: MUST be set to "none" because we do NOT modify or drop the existing USERS schema.
      ddl-auto: none
    # Set to true to print SQL statements in our console logs for easier debugging
    show-sql: true

jwt:
  # Secret passphrase for token signature (must be at least 256 bits / 32 characters)
  secret: "mySuperSecretKeyThatIsAtLeast32BytesLongForSecurity"
  # Token lifetime (1 hour = 3,600,000 milliseconds)
  expiration-ms: 3600000
