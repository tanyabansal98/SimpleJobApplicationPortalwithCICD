name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend JAR
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Build auth-service JAR
        working-directory: ./auth-service
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to ECR public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push backend image
        working-directory: ./backend
        run: |
          docker build --platform linux/amd64 -t public.ecr.aws/n2z6y4a9/job-portal-backend:latest .
          docker push public.ecr.aws/n2z6y4a9/job-portal-backend:latest

      - name: Build and push auth-service image
        working-directory: ./auth-service
        run: |
          docker build --platform linux/amd64 -t public.ecr.aws/n2z6y4a9/job-portal-auth-service:latest .
          docker push public.ecr.aws/n2z6y4a9/job-portal-auth-service:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
            docker pull public.ecr.aws/n2z6y4a9/job-portal-backend:latest
            docker pull public.ecr.aws/n2z6y4a9/job-portal-auth-service:latest
            cd /home/ec2-user
            docker-compose down
            docker-compose up -d